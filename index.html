:root{--bg:#f4f7f4;--card:#ffffff;--text:#20362c;--muted:#64766b;--accent:#276b48;--accent2:#e4f2e9;--danger:#b54141;--line:#dde8e0;--shadow:0 5px 22px rgba(30,65,45,.07)}

button{transition:background .15s ease,transform .15s ease,box-shadow .15s ease;border-radius:10px}

.grid{gap:16px}

tr:nth-child(even) td{background:#fbfdfb}
tr:hover td{background:#f2f8f3}

/* Interfaccia moderna: menu laterale e superfici leggere */
:root{--bg:#f5f7f8;--card:#fff;--text:#192e24;--muted:#667d71;--accent:#167449;--accent2:#e7f4eb;--shadow:0 5px 22px #164a3010}
body{background:#f5f7f8;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

@media(max-width:1020px){header{padding-left:240px}.wrap{padding-left:240px}#nav{width:215px}.side-link{font-size:12px;padding:9px}}
@media(max-width:760px){header{padding:16px;min-height:0;flex-direction:row;align-items:center}header h1{font-size:21px}.wrap{padding:14px 12px 55px}#nav{position:relative;width:auto;max-height:255px;overflow-y:auto;border-radius:15px;margin-bottom:18px;padding:12px}.side-brand{font-size:16px;padding:3px 8px 10px;margin-bottom:7px}.side-brand small{display:none}.side-group{display:inline-block;vertical-align:top;width:48%;margin-bottom:7px}.side-label{font-size:10px;padding:7px}.side-link{font-size:12px;padding:8px;min-height:37px}.card{padding:16px}.grid{gap:12px}}

<body>
<header><div><h1>🌱 Il Mio Orto</h1><div>V8.0 · Grafica moderna</div></div><button class="secondary" onclick="backup()">💾 Backup</button></header>
<div class="wrap">
<nav id="nav"></nav>
<div id="printHeading" class="print-heading"><h2>Il Mio Orto — Report</h2><p id="printMeta"></p></div>
<section id="app"></section>
</div>
<script>
const KEY="ortoGestionale_TEST_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"colture":[],"attivita":[],"raccolti":[],"trattamenti":[]}');
db.trattamenti=db.trattamenti||[];db.trattamenti ||= []; db.mappa ||= []; db.irrigazioni ||= []; db.concimazioni ||= []; db.foto ||= []; db.alberi ||= []; db.prodotti ||= []; db.movimentiMagazzino ||= []; db.fotoSchede ||= []; db.pianiIrrigazione ||= []; db.semine ||= []; db.rotazioni ||= []; db.spese ||= []; db.prezziRaccolti ||= []; db.eventiFrutteto ||= []; db.lavoriAnnuali ||= []; db.trappole ||= []; db.controlliTrappole ||= []; db.sementi ||= []; db.movimentiSementi ||= []; db.impostazioniMeteo ||= {localita:'Forlì',lat:44.2226,lon:12.0408,gelata:2,caldo:32,pioggia:10}; let page="dashboard"; window.ripetizione=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db));cloudChanged();render()}
const GROUPS=[
 {id:"dashboard",label:"🏠 Dashboard",items:[["dashboard","Panoramica"]]},
 {id:"piante",label:"🌱 Piante",items:[["colture","🌿 Colture"],["alberi","🌳 Alberi da frutto"],["frutteto","🍎 Diario del frutteto"],["schede","📷 Schede e foto"],["dettaglio","📒 Scheda pianta"],["mappa","🗺️ Mappa orto"]]},
 {id:"interventi",label:"🧴 Interventi",items:[["irrigazioni","💧 Irrigazioni"],["concimazioni","🌾 Concimazioni"],["trattamenti","🧴 Trattamenti"],["trappole","🪤 Trappole insetti"],["prodotti","📦 Prodotti e magazzino"],["attivita","📋 Attività"]]},
 {id:"pianificazione",label:"📅 Pianificazione",items:[["semine","🌱 Semine e trapianti"],["sementi","🌰 Magazzino sementi"],["rotazioni","🔄 Rotazioni"],["calendario","🗓️ Calendario"],["annuale","📆 Piano annuale"],["promemoria","🔔 Scadenze"]]},
 {id:"cloud",label:"☁️ Sincronizzazione",items:[["cloud","☁️ Mac e Linux"]]},
  {id:"strumenti",label:"📊 Strumenti",items:[["raccolti","🍅 Raccolti"],["economia","💶 Costi e produttività"],["statistiche","📊 Statistiche"],["bilancio","📑 Bilancio annuale"],["confronto","📈 Confronti raccolti"],["meteo","🌦️ Meteo"],["ricerca","🔎 Ricerca"],["controllo","🛡️ Controllo dati"],["stampa","🖨️ Stampa"],["dati","💾 Backup"]]}
];
function goGroup(id){let g=GROUPS.find(x=>x.id===id);if(g){page=g.items[0][0];render()}}
function toggleMenuGroup(id){
 const group=document.getElementById('menu-group-'+id);
 if(!group)return;
 const closed=group.classList.toggle('menu-collapsed');
 const btn=group.querySelector('.side-group-button');
 if(btn){btn.setAttribute('aria-expanded',String(!closed));const arrow=btn.querySelector('.group-arrow');if(arrow)arrow.textContent=closed?'▸':'▾'}
}

function nav(){
 let active=GROUPS.find(g=>g.items.some(item=>item[0]===page))||GROUPS[0];
 document.getElementById("nav").innerHTML=`<div class="side-brand">🌿 <strong>Il Mio Orto</strong><small>GESTIONALE V8.0</small></div>${GROUPS.map(g=>`<div class="side-group" id="menu-group-${g.id}"><button type="button" class="side-label side-group-button" onclick="toggleMenuGroup('${g.id}')" aria-expanded="true" title="Mostra o nascondi le opzioni di ${g.label}">${g.label} <span class="group-arrow" aria-hidden="true">▾</span></button>${g.items.map(item=>`<button type="button" class="side-link ${page===item[0]?'selected':''}" aria-current="${page===item[0]?'page':'false'}" onclick="page='${item[0]}';render()">${item[1]}</button>`).join('')}</div>`).join('')}`;
}
function render(){if(page==="cloud"){nav();cloudPage(document.getElementById("app"));return}if(window.ripetizione && page!==window.ripetizione.tipo)window.ripetizione=null;nav();let a=document.getElementById("app"); if(page=="dashboard")dash(a); if(page=="colture")colture(a); if(page=="attivita")attivita(a); if(page=="raccolti")raccolti(a); if(page=="trattamenti")trattamenti(a);if(page=="trappole")trappole(a); if(page=="mappa")mappa(a); if(page=="dati")dati(a); if(page=="irrigazioni")irrigazioni(a);if(page=="concimazioni")concimazioni(a);if(page=="schede")schede(a);if(page=="dettaglio")dettaglioPianta(a);if(page=="calendario")calendario(a);if(page=="semine")semine(a);if(page=="sementi")sementi(a);if(page=="rotazioni")rotazioni(a);if(page=="statistiche")statistiche(a);if(page=="annuale")pianoAnnuale(a);if(page=="bilancio")bilancioAnnuale(a);if(page=="economia")economia(a);if(page=="confronto")confronto(a);if(page=="alberi")alberi(a);if(page=="frutteto")frutteto(a);if(page=="meteo")meteo(a);if(page=="ricerca")ricerca(a);if(page=="controllo")controlloDati(a);if(page=="promemoria")promemoria(a);if(page=="prodotti")prodotti(a);if(page=="stampa")stampa(a);aggiornaIntestazioneStampa();aggiungiPulsanteStampa()}

const PRINT_SECTIONS=[['annuale','Piano annuale'],['bilancio','Bilancio annuale'],['controllo','Controllo dati'],['frutteto','Diario del frutteto'],['semine','Semine e trapianti'],['rotazioni','Rotazioni colturali'],['economia','Costi e produttività'],['mappa','Mappa orto'],['schede','Schede e foto'],['colture','Colture'],['alberi','Alberi da frutto'],['irrigazioni','Irrigazioni'],['concimazioni','Concimazioni'],['trattamenti','Trattamenti'],['trappole','Trappole insetti'],['raccolti','Raccolti'],['attivita','Attività'],['prodotti','Prodotti e magazzino'],['statistiche','Statistiche'],['confronto','Confronti raccolti'],['calendario','Calendario'],['promemoria','Scadenze']];
function aggiornaIntestazioneStampa(){
 let label=PRINT_SECTIONS.find(x=>x[0]===page)?.[1]||'Report';
 const title=document.querySelector('#printHeading h2'),meta=document.getElementById('printMeta');
 if(title)title.textContent='Il Mio Orto — '+label;
 if(meta)meta.textContent='Stampato il '+new Date().toLocaleDateString('it-IT')+' · Gestionale V8.0';
}
function stampaPagina(){
 if(page==='stampa')return alert('Seleziona prima una sezione da stampare.');
 aggiornaIntestazioneStampa();window.print();
}
function stampa(a){
 a.innerHTML=`<h2>🖨️ Stampa e report</h2><div class="card"><h3>Stampa una sezione</h3><p>Seleziona cosa vuoi stampare. Si aprirà la sezione scelta; in alto troverai il pulsante «Stampa questa pagina».</p>
 <div class="form"><label>Sezione da stampare<select id="printSection">${PRINT_SECTIONS.map(([id,label])=>`<option value="${id}">${esc(label)}</option>`).join('')}</select></label></div>
 <button onclick="apriSezioneStampa()">Apri anteprima</button></div>
 <div class="card" style="margin-top:15px"><h3>Stampa e PDF</h3><p>Usa «Stampa questa pagina» per aprire la finestra di stampa del browser. Puoi scegliere la stampante oppure «Salva come PDF».</p><p class="muted">Per stampare la mappa con i colori, abilita «Stampa sfondi» nelle opzioni del browser. I pulsanti e i campi di inserimento non saranno stampati.</p></div>`;
}
function apriSezioneStampa(){const id=document.getElementById('printSection').value;if(!PRINT_SECTIONS.some(x=>x[0]===id))return;page=id;render();window.scrollTo(0,0)}
function aggiungiPulsanteStampa(){
 let a=document.getElementById('app');if(!a||page==='stampa'||page==='dati'||page==='meteo'||page==='ricerca')return;
 const toolbar=document.createElement('div');toolbar.className='print-tools no-print';
 const btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.textContent='🖨️ Stampa questa pagina / Salva PDF';btn.onclick=stampaPagina;
 toolbar.appendChild(btn);a.prepend(toolbar);
}
function dash(a){
 const oggi=localDay(new Date()),fine=addDays(oggi,7),sc=scadenze(),vicine=sc.filter(x=>x.data<=fine),ritardo=vicine.filter(x=>x.data<oggi),avvisi=avvisiMagazzino(),anomalie=controlliArchivio();
 const piantine=db.colture.length+db.alberi.length;
 const raccolto=db.raccolti.reduce((n,x)=>n+(Number(x.q)||0),0);
 const prossimi=vicine.slice(0,8);
 a.innerHTML=`<h2>🏠 Centro di controllo dell'orto</h2><div class="grid">
 <div class="card"><div class="muted">Piante registrate</div><div class="stat">${piantine}</div><button class="secondary" onclick="page='schede';render()">Apri schede</button></div>
 <div class="card"><div class="muted">Scadenze entro 7 giorni</div><div class="stat">${vicine.length}</div><p class="muted">${ritardo.length} in ritardo</p><button class="secondary" onclick="page='promemoria';render()">Vedi scadenze</button></div>
 <div class="card"><div class="muted">Avvisi magazzino</div><div class="stat">${avvisi.length}</div><button class="secondary" onclick="page='prodotti';render()">Apri magazzino</button></div>

const coloriGrafico=['#227a41','#cf6a21','#2459b5','#a43e92','#8a7121','#12838d','#9b423b','#5a50a2'];
function graficoMensileSVG(anni,records){
 const left=58,right=890,top=28,bottom=293,w=right-left,h=bottom-top;
 const valid=anni.filter(y=>records.some(r=>Number(r.data.slice(0,4))===y));
 const values=y=>Array.from({length:12},(_,i)=>records.filter(r=>Number(r.data.slice(0,4))===y&&Number(r.data.slice(5,7))===i+1).reduce((s,r)=>s+Number(r.q),0));
 const max=Math.max(1,...valid.flatMap(y=>values(y)));
 const ceiling=Math.ceil(max/5)*5||5;
 const x=i=>left+(w*i/11),yy=v=>bottom-h*v/ceiling;
 let out='';
 for(let i=0;i<=5;i++){let v=ceiling*i/5,y=yy(v);out+=`<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#e0e8df"/><text x="${left-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#526452">${v.toFixed(v%1?1:0)}</text>`}
 ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'].forEach((m,i)=>out+=`<text x="${x(i)}" y="${bottom+24}" text-anchor="middle" font-size="12" fill="#526452">${m}</text>`);
 out+=`<text x="12" y="18" font-size="12" fill="#526452">kg</text>`;
 valid.forEach(y=>{let vs=values(y),color=coloriGrafico[anni.indexOf(y)%coloriGrafico.length];out+=`<polyline points="${vs.map((v,i)=>`${x(i)},${yy(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;vs.forEach((v,i)=>{out+=`<circle cx="${x(i)}" cy="${yy(v)}" r="4" fill="${color}"><title>${y} - ${i+1}: ${v.toFixed(3)} kg</title></circle>`})});
 return out;
}
let confrontoTipo='mensile', confrontoOrtaggio='tutti';
function confronto(a){
 const anni=anniDisponibili();
 const norm=s=>String(s||'').trim().toLocaleLowerCase('it-IT');
 const ortaggi=[...new Set(db.raccolti.map(x=>norm(x.coltura)).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'it'));
 if(confrontoOrtaggio!=='tutti'&&!ortaggi.includes(confrontoOrtaggio))confrontoOrtaggio='tutti';
 const records=db.raccolti.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.data||'') && Number.isFinite(Number(x.q)) && Number(x.q)>0 && (confrontoOrtaggio==='tutti'||norm(x.coltura)===confrontoOrtaggio));
 const somma=(anno,mese)=>records.filter(x=>Number(x.data.slice(0,4))===anno && (!mese||Number(x.data.slice(5,7))===mese)).reduce((sum,x)=>sum+Number(x.q),0);
 const count=(anno,mese)=>records.filter(x=>Number(x.data.slice(0,4))===anno && (!mese||Number(x.data.slice(5,7))===mese)).length;
 const mesi=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
 const righe=confrontoTipo==='mensile'?mesi.map((m,i)=>({label:m,mese:i+1})):ortaggi.map(n=>({label:n,ortaggio:n}));
 const annuali=anni.map(y=>somma(y));
 const max=Math.max(1,...annuali);
 a.innerHTML=`<h2>📈 Confronto raccolti</h2><div class="card"><div class="form"><label>Visualizzazione<select id="tipoConfronto" onchange="confrontoTipo=this.value;render()"><option value="mensile" ${confrontoTipo==='mensile'?'selected':''}>Confronto mensile</option><option value="ortaggi" ${confrontoTipo==='ortaggi'?'selected':''}>Confronto per ortaggio</option></select></label><label>Filtra ortaggio<select id="ortaggioConfronto" onchange="confrontoOrtaggio=this.value;render()"><option value="tutti">Tutti gli ortaggi</option>${ortaggi.map(n=>`<option value="${esc(n)}" ${n===confrontoOrtaggio?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div><p class="muted">Le celle con — non hanno pesate registrate. Gli anni futuri saranno aggiunti automaticamente quando inserirai nuove pesate.</p><div style="overflow-x:auto"><table><thead><tr><th>${confrontoTipo==='mensile'?'Mese':'Ortaggio'}</th>${anni.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${righe.map(r=>`<tr><td><b>${esc(r.label)}</b></td>${anni.map(y=>{let kg=confrontoTipo==='mensile'?somma(y,r.mese):db.raccolti.filter(x=>Number((x.data||'').slice(0,4))===y&&norm(x.coltura)===r.ortaggio).reduce((s,x)=>s+(Number(x.q)||0),0);let n=confrontoTipo==='mensile'?count(y,r.mese):db.raccolti.filter(x=>Number((x.data||'').slice(0,4))===y&&norm(x.coltura)===r.ortaggio).length;return `<td>${n?kg.toFixed(3)+' kg':'—'}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${anni.length+1}">Nessun raccolto registrato.</td></tr>`}<tr><th>Totale annata</th>${anni.map((y,i)=>`<th>${count(y)?annuali[i].toFixed(3)+' kg':'—'}</th>`).join('')}</tr></tbody></table></div></div>
 <div class="card" style="margin-top:16px"><h3>📊 Grafico produzione annuale</h3><p class="muted">Quantità in kg ${confrontoOrtaggio==='tutti'?'di tutti gli ortaggi':'di '+esc(confrontoOrtaggio)}.</p>${anni.map((y,i)=>`<div style="margin:14px 0"><div class="rowbuttons"><b>${y}</b><span>${count(y)?annuali[i].toFixed(3)+' kg':'Nessuna pesata'}</span></div><div class="bar"><span style="display:block;width:${count(y)?100*annuali[i]/max:0}%;height:100%;min-height:10px"></span></div></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h3>📉 Andamento mensile delle annate</h3><p class="muted">Ogni linea rappresenta un anno. Passa il mouse sui punti per leggere i kg; su telefono consulta anche la tabella sopra. Le annate senza pesate non vengono tracciate.</p><div style="overflow-x:auto"><svg role="img" aria-label="Grafico a linee dei raccolti mensili per annata" viewBox="0 0 920 350" style="width:100%;min-width:560px;max-height:410px;background:#fff;border:1px solid #e5eae3;border-radius:12px">${graficoMensileSVG(anni,records)}</svg></div><p class="muted">${anni.filter(y=>records.some(r=>Number(r.data.slice(0,4))===y)).map((y,i)=>`<span style="display:inline-block;margin-right:14px"><span style="display:inline-block;width:16px;height:4px;background:${coloriGrafico[anni.indexOf(y)%coloriGrafico.length]};vertical-align:middle"></span> ${y}</span>`).join('')||'Nessuna pesata da rappresentare'}</p></div>
 <div class="rowbuttons" style="margin-top:16px"><button onclick="exportRaccoltiCSV()">Esporta pesate CSV</button><button class="secondary" onclick="page='raccolti';render()">Torna ai raccolti</button></div>`;
}
function exportRaccoltiCSV(){let rows=[['Data','Annata','Ortaggio','Peso kg','Note'],...db.raccolti.map(x=>[x.data,(x.data||'').slice(0,4),x.coltura,x.q,x.note])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='raccolti-per-annata.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function del(type,i){if(confirm("Eliminare questa voce?")){let old=db[type][i];if((type==='colture'||type==='alberi')&&old&&old.pid){db.mappa.forEach(x=>{if(x.plantId===old.pid)x.plantId=''});db.fotoSchede=db.fotoSchede.filter(f=>f.plantId!==old.pid);if(type==='alberi')db.eventiFrutteto=db.eventiFrutteto.filter(f=>f.plantId!==old.pid)}db[type].splice(i,1);if(type==='colture'){db.foto=db.foto.filter(f=>f.indice!==i).map(f=>({...f,indice:f.indice>i?f.indice-1:f.indice}))}save()}}

function salvaTrappola(){
 const nome=trNome.value.trim(),data=trData.value;
 if(!nome||!data)return alert('Inserisci nome e data di installazione.');
 const stockId=trStock.value,product=stockId?db.prodotti.find(x=>x.id===stockId):null;
 if(stockId&&(!product||product.tipo!=='trappole'||product.unita!=='pz'||Number(product.giacenza)<1))return alert('Scorta trappole insufficiente.');
 const trapId='trap_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
 if(product){product.giacenza=Number(product.giacenza)-1;db.movimentiMagazzino.push({id:'mv_'+Date.now()+Math.random(),prodottoId:product.id,data,prodotto:product.nome,tipo:'Installazione trappola',quantita:-1,unita:'pz',trapId});}
 db.trappole.push({id:trapId,prodottoId:stockId,nome,plantId:trAlbero.value,posizione:trPos.value.trim(),tipo:trTipo.value,insetto:trInsetto.value.trim(),data,prossimo:trProssimo.value,scadenza:trScadenza.value,note:trNote.value.trim(),stato:'Attiva'});save();
}
function nuovoControlloTrappola(id){
 const t=db.trappole.find(x=>x.id===id);if(!t)return;
 const data=prompt('Data controllo (AAAA-MM-GG)',localDay(new Date()));if(data===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(data)||Number.isNaN(Date.parse(data)))return alert('Data non valida');
 const q=prompt('Numero di insetti catturati', '0');if(q===null)return;
 if(!/^\d+$/.test(q.trim()))return alert('Inserisci un numero intero non negativo.');
 const note=prompt('Note del controllo (facoltative)','');if(note===null)return;
 db.controlliTrappole.push({id:'ctrl_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),trapId:id,data,catture:Number(q),note:note.trim()});
 const next=prompt('Data del prossimo controllo (AAAA-MM-GG; lascia vuoto per nessuna)',t.prossimo||'');if(next!==null){if(next&&!/^\d{4}-\d{2}-\d{2}$/.test(next))return alert('Controllo salvato, ma la prossima data non è valida.');t.prossimo=next;}
 save();
}
function modificaTrappola(id){
 const t=db.trappole.find(x=>x.id===id);if(!t)return;
 for(const [key,label] of [['nome','Nome'],['posizione','Posizione'],['insetto','Insetto'],['prossimo','Prossimo controllo (AAAA-MM-GG)'],['scadenza','Sostituzione attrattivo (AAAA-MM-GG)'],['note','Note']]){
  const val=prompt(label,t[key]||'');if(val===null)break;
  if(['prossimo','scadenza'].includes(key)&&val&&!/^\d{4}-\d{2}-\d{2}$/.test(val)){alert('Data non valida');break;}
  if(key==='nome'&&!val.trim()){alert('Il nome non può essere vuoto');break;}t[key]=val.trim();
 }save();
}
function statoTrappola(id){const t=db.trappole.find(x=>x.id===id);if(!t)return;t.stato=t.stato==='Attiva'?'Rimossa':'Attiva';save()}
function eliminaTrappola(id){if(!confirm('Eliminare la trappola e i controlli? Lo scarico resta in magazzino; usa ± Scorta per una restituzione effettiva.'))return;db.trappole=db.trappole.filter(x=>x.id!==id);db.controlliTrappole=db.controlliTrappole.filter(x=>x.trapId!==id);save()}
function modificaControllo(id){const c=db.controlliTrappole.find(x=>x.id===id);if(!c)return;const val=prompt('Catture',String(c.catture));if(val===null)return;if(!/^\d+$/.test(val.trim()))return alert('Numero non valido');const note=prompt('Note',c.note||'');if(note===null)return;c.catture=Number(val);c.note=note.trim();save()}

function schedaStorico(p){
 const match=x=>String(x.coltura||'').trim().toLocaleLowerCase('it')===p.nome.trim().toLocaleLowerCase('it');
 return [
 ...db.irrigazioni.filter(match).map(x=>({data:x.data,tipo:'💧 Irrigazione',dettaglio:(x.litri||'')+' L · '+(x.note||'')})),
 ...db.concimazioni.filter(match).map(x=>({data:x.data,tipo:'🌾 Concimazione',dettaglio:(x.prodotto||'')+' '+(x.q||'')+' '+(x.unita||'')+' · '+(x.note||'')})),
 ...db.trattamenti.filter(match).map(x=>({data:x.data,tipo:'🧴 Trattamento',dettaglio:(x.prodotto||'')+' '+(x.dose||'')+' · '+(x.note||'')})),
 ...db.attivita.filter(match).map(x=>({data:x.data,tipo:'📋 '+(x.tipo||'Attività'),dettaglio:x.note||''})),
 ...db.raccolti.filter(match).map(x=>({data:x.data,tipo:'🍅 Raccolto',dettaglio:(x.q||'')+' kg · '+(x.note||'')}))
 ].sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));
}

function salvaSchedaCompleta(){
 let p=piantaById(schedaCorrente);if(!p)return;
 let x=p.kind==='albero'?db.alberi[p.i]:db.colture[p.i];
 if(!sdNome.value.trim())return alert('Il nome è obbligatorio');
 if(p.kind==='albero'){x.specie=sdNome.value.trim();x.varieta=sdVar.value;x.sede=sdSede.value}
 else{x.nome=sdNome.value.trim();x.var=sdVar.value}
 x.data=sdData.value;x.pos=sdPos.value;x.stato=sdStato.value;x.note=sdNote.value;
 db.mappa.filter(m=>m.plantId===p.id).forEach(m=>m.nome=sdNome.value.trim());
 save();alert('Scheda salvata');
}
async function aggiungiFotoScheda(){

 catch(e){alert('Non è stato possibile salvare la foto: '+e.message)}
}

function avvisiMagazzino(){
 const today=localDay(new Date()),soon=addDays(today,30);

 });

function modificaProdotto(i){

function normalizzaMovimentiMagazzino(){
 db.prodotti.forEach(p=>{if(!p.id)p.id='pr_'+Math.random().toString(36).slice(2)+Date.now().toString(36)});
 db.movimentiMagazzino.forEach(m=>{
  if(!m.id)m.id='mv_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  if(!m.prodottoId){const matches=db.prodotti.filter(p=>p.nome===m.prodotto&&p.unita===m.unita);if(matches.length===1)m.prodottoId=matches[0].id;}
 });
}

function correggiMovimento(i){
 const m=db.movimentiMagazzino[i];if(!m)return;
 const p=db.prodotti.find(p=>p.id===m.prodottoId);
 if(!p)return alert('Impossibile correggere: il prodotto originale non è identificabile con certezza. Usa ± Scorta per una rettifica manuale.');
 const input=prompt('Nuova variazione in '+p.unita+' (es. 50 o -10)',String(m.quantita));if(input===null)return;
 const n=Number(input.trim().replace(',','.'));
 if(!input.trim()||!Number.isFinite(n)||n===0)return alert('Quantità non valida');
 const old=Number(m.quantita),difference=n-old;
 if(!Number.isFinite(old))return alert('Movimento non valido');
 if(Number(p.giacenza||0)+difference<0&&!confirm('La giacenza diventerà negativa. Continuare?'))return;
 if(!confirm('Correggere il movimento da '+old+' a '+n+' '+p.unita+'? La giacenza cambierà di '+difference+' '+p.unita+'.'))return;
 p.giacenza=Math.round((Number(p.giacenza||0)+difference)*10000)/10000;
 m.quantita=n;m.modificato=localDay(new Date());m.tipo=m.tipo+' (corretto)';save();
}
function annullaMovimento(i){
 const m=db.movimentiMagazzino[i];if(!m)return;
 const p=db.prodotti.find(p=>p.id===m.prodottoId);
 if(!p)return alert('Impossibile annullare: prodotto non identificabile con certezza. Usa ± Scorta per correggere manualmente.');
 const q=Number(m.quantita);
 if(!Number.isFinite(q))return alert('Movimento non valido');
 const next=Number(p.giacenza||0)-q;
 if(next<0&&!confirm('Annullando il movimento, la giacenza diventerà negativa. Continuare?'))return;
 if(!confirm('Annullare il movimento di '+q+' '+p.unita+' per '+p.nome+'? La giacenza verrà ricalcolata.'))return;
 p.giacenza=Math.round(next*10000)/10000;
 db.movimentiMagazzino.splice(i,1);save();
}

function scaricaDaMagazzino(tipo,id,q,unita,acqua){if(id==='')return;let p=db.prodotti[Number(id)];if(!p||p.tipo!==tipo)return;let qty=Number(q),used=qty;if(tipo==='trattamenti'&&['ml/L','g/L','ml/10 L','g/10 L'].includes(unita)){if(!Number(acqua)||Number(acqua)<=0){alert('Acqua non indicata: giacenza non aggiornata automaticamente.');return}used=qty*Number(acqua)/(unita.includes('/10 L')?10:1);unita=unita.startsWith('ml')?'ml':'g'}
if(!Number.isFinite(used)||used<=0)return;
let base=p.unita,conv=unita===base?1:(unita==='g'&&base==='kg'||unita==='ml'&&base==='L')?.001:(unita==='kg'&&base==='g'||unita==='L'&&base==='ml')?1000:null;
if(conv===null){alert('Unità non compatibili con il magazzino: nessuno scarico automatico.');return}let n=used*conv;p.giacenza=Math.round((Number(p.giacenza||0)-n)*10000)/10000;db.movimentiMagazzino.push({id:'mv_'+Date.now()+Math.random(),prodottoId:p.id,data:localDay(new Date()),prodotto:p.nome,tipo:'Utilizzo',quantita:-n,unita:base});if(p.giacenza<0)alert('Attenzione: giacenza negativa per '+p.nome+'. Verifica le quantità.');}

function cambiaStatoEventoFrutteto(i){const x=db.eventiFrutteto[i];if(!x)return;x.stato=x.stato==='Programmato'?'Eseguito':'Programmato';save()}
function modificaEventoFrutteto(i){
 const x=db.eventiFrutteto[i];if(!x)return;
 const data=prompt('Data (AAAA-MM-GG)',x.data);if(data===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(data))return alert('Data non valida.');
 let kg=x.kg||0;
 if(x.tipo==='Raccolta'){const val=prompt('Kg raccolti',kg);if(val===null)return;kg=Number(val.replace(',','.'));if(!Number.isFinite(kg)||kg<0)return alert('Kg non validi.')}
 const note=prompt('Note',x.note||'');if(note===null)return;
 x.data=data;x.kg=kg;x.note=note;save();
}

let meteoStato={loading:false,errore:'',data:null,aggiornato:''};

 const c=db.impostazioniMeteo;

 </div>
 <div class="card" style="margin-top:15px"><h3>⚙️ Impostazioni e soglie</h3><p class="muted">Le coordinate sono modificabili per usare il meteo di un altro luogo. La località è solo un'etichetta: i dati dipendono da latitudine e longitudine.</p>
 <div class="form"><label>Località<input id="mtLocalita" value="${esc(c.localita)}"></label>

function salvaImpostazioniMeteo(){
 const lat=Number(mtLat.value),lon=Number(mtLon.value),gelata=Number(mtGelata.value),caldo=Number(mtCaldo.value),pioggia=Number(mtPioggia.value);
 if(!mtLocalita.value.trim()||!mtLat.value||!mtLon.value||!mtGelata.value||!mtCaldo.value||!mtPioggia.value||!Number.isFinite(lat)||lat< -90||lat>90||!Number.isFinite(lon)||lon< -180||lon>180||![gelata,caldo,pioggia].every(Number.isFinite)||pioggia<0)return alert('Controlla località, coordinate e soglie.');
 const changed=lat!==db.impostazioniMeteo.lat||lon!==db.impostazioniMeteo.lon;
 db.impostazioniMeteo={localita:mtLocalita.value.trim(),lat,lon,gelata,caldo,pioggia};
 if(changed)meteoStato={loading:false,errore:'',data:null,aggiornato:''};
 save();
}
async function aggiornaMeteo(){
 if(meteoStato.loading)return;
 meteoStato.loading=true;meteoStato.errore='';render();
 try{
  const c=db.impostazioniMeteo;
  const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(c.lat)+'&longitude='+encodeURIComponent(c.lon)+'&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=Europe%2FRome&forecast_days=7';
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('Servizio meteo non disponibile (HTTP '+response.status+').');
  const json=await response.json();
  if(!json.daily||!Array.isArray(json.daily.time))throw new Error('Risposta meteo non valida.');
  meteoStato.data=json;meteoStato.aggiornato=new Date().toLocaleString('it-IT');
 }catch(e){meteoStato.errore='Impossibile scaricare le previsioni: '+e.message+'. Verifica Internet o riprova più tardi.'}
 finally{meteoStato.loading=false;if(page==='meteo')render()}
}


function addDays(iso,n){if(!iso||!Number.isFinite(Number(n)))return '';let d=new Date(iso+'T12:00:00');if(isNaN(d))return '';d.setDate(d.getDate()+Number(n));return localDay(d)}
function scadenze(){let out=[];db.trappole.forEach((x,i)=>{if(x.stato!=='Attiva')return;if(x.prossimo)out.push({data:x.prossimo,tipo:'🪤 Controllo trappola',coltura:x.nome,note:x.insetto||'',origine:'trappole',indice:i});if(x.scadenza)out.push({data:x.scadenza,tipo:'🪤 Sostituzione attrattivo',coltura:x.nome,note:x.tipo||'',origine:'trappole',indice:i})});db.lavoriAnnuali.forEach((x,i)=>{if(x.stato==='Programmato'&&x.data)out.push({data:x.data,tipo:'Piano annuale · '+x.lavoro,coltura:x.pianta||'',note:x.note||'',origine:'lavoriAnnuali',indice:i})});db.eventiFrutteto.forEach((x,i)=>{if(x.stato==='Programmato'&&x.data)out.push({data:x.data,tipo:'Frutteto · '+x.tipo,coltura:piantaById(x.plantId)?.nome||'Albero',note:x.note||'',origine:'eventiFrutteto',indice:i})});db.attivita.forEach((x,i)=>{if(x.data)out.push({data:x.data,tipo:x.tipo||'Attività',coltura:x.coltura||'',note:x.note||'',origine:'attivita',indice:i})});db.trattamenti.forEach((x,i)=>{if(x.prossimo)out.push({data:x.prossimo,tipo:'Trattamento da rifare',coltura:x.coltura||'',note:x.prodotto||'',origine:'trattamenti',indice:i})});db.concimazioni.forEach((x,i)=>{if(x.prossimo)out.push({data:x.prossimo,tipo:'Concimazione da rifare',coltura:x.coltura||'',note:x.prodotto||'',origine:'concimazioni',indice:i})});db.semine.filter(x=>x.stato==='Programmato'&&x.data).forEach((x,i)=>out.push({data:x.data,tipo:x.tipo||'Semina',coltura:x.coltura,note:x.zona||'',origine:'semine',indice:i}));db.pianiIrrigazione.forEach((x,i)=>{if(x.prossima)out.push({data:x.prossima,tipo:'Irrigazione programmata',coltura:x.coltura||'',note:x.litri?x.litri+' L indicativi':'Controllare terreno',origine:'pianiIrrigazione',indice:i})});return out.sort((a,b)=>a.data.localeCompare(b.data))}
function promemoria(a){let today=localDay(new Date()),week=addDays(today,7),all=scadenze(),due=all.filter(x=>x.data<=week);a.innerHTML=`<h2>🔔 Promemoria e scadenze</h2><div class="card"><p>Attività in ritardo, oggi e nei prossimi 7 giorni. Questi promemoria sono visibili quando apri il gestionale; non inviano notifiche di sistema.</p>${due.map(x=>`<p class="due"><span class="pill">${x.data<today?'In ritardo':x.data===today?'Oggi':'In arrivo'}</span> <b>${esc(x.data)}</b> — ${esc(x.tipo)} · ${esc(x.coltura)} ${esc(x.note)}</p>`).join('')||'<p>Nessuna scadenza ravvicinata.</p>'}</div><div class="card" style="margin-top:14px"><h3>Scadenze future</h3>${all.filter(x=>x.data>week).map(x=>`<p>${esc(x.data)} — ${esc(x.tipo)} · ${esc(x.coltura)}</p>`).join('')||'<p>Nessuna.</p>'}</div>`}
function controlliArchivio(){
 const issues=[],add=(messaggio,sezione)=>issues.push({messaggio,sezione});
 const unique=(items,key,label,section)=>{const seen=new Map();items.forEach((x,i)=>{const val=key(x);if(!val)return;if(seen.has(val))add(`${label}: possibile duplicato alle righe ${seen.get(val)+1} e ${i+1}`,section);else seen.set(val,i)})};
 unique(db.colture,x=>[x.nome,x.var,x.data,x.pos].map(v=>String(v||'').trim().toLowerCase()).join('|'),'Colture','colture');
 unique(db.alberi,x=>[x.specie,x.varieta,x.data,x.pos].map(v=>String(v||'').trim().toLowerCase()).join('|'),'Alberi','alberi');
 unique(db.prodotti,x=>[x.nome,x.lotto].map(v=>String(v||'').trim().toLowerCase()).join('|'),'Magazzino','prodotti');
 db.colture.forEach((x,i)=>{if(!String(x.nome||'').trim())add(`Coltura ${i+1}: nome mancante`,'colture')});
 db.alberi.forEach((x,i)=>{if(!String(x.specie||'').trim())add(`Albero ${i+1}: specie mancante`,'alberi')});
 db.prodotti.forEach((x,i)=>{if(!String(x.nome||'').trim())add(`Prodotto ${i+1}: nome mancante`,'prodotti');if(!Number.isFinite(Number(x.giacenza))||Number(x.giacenza)<0)add(`Prodotto ${i+1}: giacenza non valida`,'prodotti')});
 db.mappa.forEach((x,i)=>{if(x.plantId&&!piantaById(x.plantId))add(`Mappa: elemento ${i+1} (${x.nome||'senza nome'}) collegato a una scheda non esistente`,'mappa')});
 db.eventiFrutteto.forEach((x,i)=>{if(x.plantId&&!piantaById(x.plantId))add(`Diario frutteto: evento ${i+1} senza albero associato`,'frutteto')});
 db.irrigazioni.forEach((x,i)=>{if(!Number.isFinite(Number(x.litri))||Number(x.litri)<=0)add(`Irrigazione ${i+1}: litri non validi`,'irrigazioni')});
 db.raccolti.forEach((x,i)=>{if(!Number.isFinite(Number(x.q))||Number(x.q)<0)add(`Raccolto ${i+1}: quantità non valida`,'raccolti')});
 return issues;
}
function controlloDati(a){
 const issues=controlliArchivio();
 a.innerHTML=`<h2>🛡️ Controllo qualità dei dati</h2><div class="card"><p>Il controllo cerca campi mancanti, possibili duplicati, giacenze o quantità non valide e collegamenti interrotti. <b>Non modifica né cancella alcun dato.</b></p><p><b>${issues.length}</b> segnalazioni</p><button onclick="render()">↻ Ripeti controllo</button> <button class="secondary" onclick="backup()">💾 Esporta backup prima delle correzioni</button></div>
 <div class="card" style="margin-top:15px">${issues.map(x=>`<p>⚠️ ${esc(x.messaggio)} <button class="secondary" onclick="page='${x.sezione}';render()">Apri sezione</button></p>`).join('')||'<p>✅ Nessuna anomalia rilevata. Il controllo non garantisce che ogni dato sia corretto.</p>'}</div>`;
}
function ricerca(a){
 const defs=[
 ['colture','Coltura',x=>[x.nome,x.var,x.pos,x.note].join(' ')],['alberi','Albero',x=>[x.specie,x.varieta,x.pos,x.note].join(' ')],

 ['spese','Spesa',x=>[x.categoria,x.coltura,x.descrizione,x.note,x.importo].join(' ')],['semine','Semina/trapianto',x=>[x.tipo,x.coltura,x.varieta,x.zona,x.note].join(' ')],
 ['rotazioni','Rotazione',x=>[x.coltura,x.famiglia,x.zona,x.anno,x.note].join(' ')],['eventiFrutteto','Diario frutteto',x=>[x.tipo,piantaById(x.plantId)?.nome||'',x.note].join(' ')],
 ['mappa','Elemento mappa',x=>[x.nome,x.tipo,x.note].join(' ')]
 ];
 const records=[];defs.forEach(([key,tipo,fmt])=>(db[key]||[]).forEach(x=>records.push({tipo,sezione:key==='spese'?'economia':key==='eventiFrutteto'?'frutteto':key,data:x.data||x.scadenza||'',testo:fmt(x)})));
 window.searchRecords=records;

 showResults();
}

}

 <div class="card" style="margin-top:15px"><h3>Scorte (${lista.length})</h3><div class="scroll"><table><tr><th>Semente</th><th>Marca / lotto</th><th>Disponibilità</th><th>Scadenza</th><th>Germinabilità</th><th>Azioni</th></tr>
 ${lista.map(x=>`<tr><td><b>${esc(x.coltura)}</b><div>${esc(x.varieta)}</div></td><td>${esc(x.marca)}<div class="muted">${esc(x.lotto)}</div></td><td>${esc(x.quantita)} ${esc(x.unita)} ${Number(x.quantita)<=Number(x.minimo||0)?'<span class="tag">Scorta bassa</span>':''}</td><td>${esc(x.scadenza||'—')} ${x.scadenza&&x.scadenza<oggi?'<span class="tag">Scaduta</span>':''}</td><td>${x.germinabilita===''?'—':esc(x.germinabilita)+'%'}</td><td><button class="secondary" onclick="rettificaSemente('${x.id}')">± Scorta</button> <button class="danger" onclick="eliminaSemente('${x.id}')">Elimina</button></td></tr>`).join('')||'<tr><td colspan="6">Nessuna semente registrata.</td></tr>'}</table></div></div>
 <div class="card" style="margin-top:15px"><h3>Ultimi movimenti</h3><div class="scroll"><table><tr><th>Data</th><th>Operazione</th><th>Quantità</th></tr>${(db.movimentiSementi||[]).slice(-30).reverse().map(m=>`<tr><td>${esc(m.data)}</td><td>${esc(m.tipo)} · ${esc(lista.find(x=>x.id===m.sementeId)?.coltura||'Semente eliminata')}</td><td>${m.quantita>0?'+':''}${esc(m.quantita)} ${esc(m.unita)}</td></tr>`).join('')}</table></div></div>`;
}
function aggiungiSemente(){
 const coltura=smColtura.value.trim(),q=Number(smQuantita.value),min=Number(smMinimo.value);
 if(!coltura||smQuantita.value===''||!Number.isFinite(q)||q<0||!Number.isFinite(min)||min<0)return alert('Inserisci ortaggio e quantità valide.');
 if(smGerminabilita.value!==''&&(Number(smGerminabilita.value)<0||Number(smGerminabilita.value)>100))return alert('Germinabilità tra 0 e 100.');
 db.sementi.push({id:'seed_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),coltura,varieta:smVarieta.value.trim(),marca:smMarca.value.trim(),lotto:smLotto.value.trim(),quantita:q,unita:smUnita.value,acquisto:smAcquisto.value,scadenza:smScadenza.value,germinabilita:smGerminabilita.value,minimo:min,note:smNote.value.trim()});save();
}
function rettificaSemente(id){
 const x=db.sementi.find(x=>x.id===id);if(!x)return;
 const raw=prompt('Variazione di scorta per '+x.coltura+' ('+x.unita+'). Esempio: +10 o -2','0');if(raw===null)return;
 if(!/^[+-]?\d+(?:[.,]\d+)?$/.test(raw.trim()))return alert('Inserisci un numero valido.');
 const n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||Number(x.quantita)+n<0)return alert('Scorta insufficiente.');
 if(!n)return;x.quantita=Number((Number(x.quantita)+n).toFixed(5));
 db.movimentiSementi.push({id:'ms_'+Date.now(),sementeId:id,data:localDay(new Date()),quantita:n,unita:x.unita,tipo:'Rettifica manuale'});save();
}
function eliminaSemente(id){if(!confirm('Eliminare questa semente? Lo storico delle semine resterà conservato.'))return;db.sementi=db.sementi.filter(x=>x.id!==id);save()}
// Cloud V8.0: niente chiavi segrete nel codice. Le credenziali restano nella sessione del browser.
const CLOUD_URL='https://ndegjeqazdzfplpuwdlg.supabase.co';
const CLOUD_KEY_STORAGE='ortoCloudPublishableKey_TEST_v1';
let cloudKey=localStorage.getItem(CLOUD_KEY_STORAGE)||'sb_publishable_0MjEcwe2lkuVyiodGn639w_FNY3eLVq';
let cloudSession=null,cloudVersion=null,cloudDirty=false,cloudBusy=false,cloudTimer=null;
let cloudStatus='Non collegato. I dati locali non sono stati modificati.';
let cloudSessionLoaded=false;
function cloudChanged(){cloudDirty=true;if(cloudSession&&cloudVersion!==null){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudUpload(false),1500)}}
function cloudMessage(t){cloudStatus=t;const e=document.getElementById('cloudStatus');if(e)e.textContent=t}
function cloudHeaders(auth=true){const h={'apikey':cloudKey,'Content-Type':'application/json'};if(auth&&cloudSession)h.Authorization='Bearer '+cloudSession.access_token;return h}
async function cloudRequest(path,opts={}){const r=await fetch(CLOUD_URL+path,{...opts,headers:{...cloudHeaders(),...(opts.headers||{})},cache:'no-store'});let body;try{body=await r.json()}catch{body=null}if(!r.ok)throw Error((body&&(body.message||body.msg||body.error_description||body.error))||('HTTP '+r.status));return {body,status:r.status}}
async function cloudToken(){if(!cloudSession)throw Error('Accedi prima.');if(Date.now()<cloudSession.expires_at-60000)return;const r=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})});cloudSession={...r.body,expires_at:Date.now()+r.body.expires_in*1000};sessionStorage.setItem('ortoCloudSession_TEST',JSON.stringify(cloudSession))}
async function cloudLogin(){const email=document.getElementById('cloudEmail').value.trim(),password=document.getElementById('cloudPassword').value,key=document.getElementById('cloudKey').value.trim();if(!email||!password||!key)return alert('Inserisci email, password e publishable key.');if(!/^sb_publishable_/.test(key))return alert('Usa soltanto la publishable key, mai secret o service_role.');cloudKey=key;localStorage.setItem(CLOUD_KEY_STORAGE,key);try{cloudMessage('Accesso in corso...');const r=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});cloudSession={...r.body,expires_at:Date.now()+r.body.expires_in*1000};sessionStorage.setItem('ortoCloudSession_TEST',JSON.stringify(cloudSession));cloudVersion=null;cloudDirty=false;cloudMessage('Accesso riuscito. Scegli come inizializzare i dati, senza sovrascrivere nulla.');render()}catch(e){cloudMessage('Accesso non riuscito: '+e.message)}}
function cloudLogout(){clearTimeout(cloudTimer);cloudSession=null;cloudVersion=null;cloudDirty=false;sessionStorage.removeItem('ortoCloudSession_TEST');cloudMessage('Disconnesso. Dati locali conservati.');render()}
async function cloudFetch(){await cloudToken();const r=await cloudRequest('/rest/v1/orto_dati?select=dati,versione&user_id=eq.'+encodeURIComponent(cloudSession.user.id),{headers:{Accept:'application/json'}});return r.body?.[0]||null}
async function cloudInitialize(){if(!cloudSession)return; if(!confirm('Creare il primo archivio cloud usando i dati attualmente presenti in QUESTO browser? Scarica prima un backup JSON.'))return;try{cloudBusy=true;await cloudToken();const remote=await cloudFetch();if(remote){cloudMessage('Esiste già un archivio cloud: nessun dato sovrascritto. Usa Scarica dal cloud.');return}const r=await cloudRequest('/rest/v1/orto_dati',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:cloudSession.user.id,dati:db,versione:1})});cloudVersion=r.body?.[0]?.versione||1;cloudDirty=false;cloudMessage('Archivio cloud inizializzato. Versione '+cloudVersion+'.');render()}catch(e){cloudMessage('Inizializzazione non riuscita: '+e.message)}finally{cloudBusy=false}}
async function cloudDownload(){if(!cloudSession)return;try{cloudBusy=true;const remote=await cloudFetch();if(!remote){cloudMessage('Archivio cloud ancora vuoto. Inizializzalo dal Mac che contiene tutti i dati.');return}if(!remote.dati||!Array.isArray(remote.dati.colture)||!Array.isArray(remote.dati.alberi))throw Error('Archivio cloud non riconosciuto');if(!confirm('Sostituire i dati locali di questo browser con quelli cloud? Scarica prima un backup JSON se vuoi conservarli.'))return;db=remote.dati;db.sementi ||= [];db.movimentiSementi ||= [];cloudVersion=remote.versione;cloudDirty=false;localStorage.setItem(KEY,JSON.stringify(db));ensurePlantIds();cloudMessage('Dati scaricati dal cloud. Versione '+cloudVersion+'.');render()}catch(e){cloudMessage('Download non riuscito: '+e.message)}finally{cloudBusy=false}}
async function cloudUpload(manual=true){if(!cloudSession||cloudBusy)return;if(cloudVersion===null){if(manual)cloudMessage('Prima scegli Inizializza archivio oppure Scarica dal cloud.');return}if(!cloudDirty&&!manual)return;try{cloudBusy=true;await cloudToken();const snap=JSON.stringify(db),v=cloudVersion;const r=await cloudRequest('/rest/v1/orto_dati?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&versione=eq.'+v,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({dati:JSON.parse(snap),versione:v+1,aggiornato_il:new Date().toISOString()})});if(!Array.isArray(r.body)||r.body.length!==1){cloudDirty=true;cloudVersion=null;cloudMessage('CONFLITTO: altri dati sono stati salvati dal secondo computer. Nessuna sovrascrittura. Esporta backup e confronta prima di scaricare dal cloud.');return}cloudVersion=v+1;cloudDirty=JSON.stringify(db)!==snap;cloudMessage('Sincronizzato sul cloud · versione '+cloudVersion+(cloudDirty?' · altre modifiche in attesa':''));if(cloudDirty){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudUpload(false),1500)}}catch(e){cloudDirty=true;cloudMessage('Sincronizzazione non riuscita: '+e.message+' · dati conservati localmente.')}finally{cloudBusy=false}}
async function cloudCheck(){if(!cloudSession||cloudBusy||cloudDirty)return;try{const remote=await cloudFetch();if(remote&&cloudVersion!==null&&remote.versione!==cloudVersion){cloudMessage('Ci sono modifiche dal secondo computer. Premi Scarica dal cloud per aggiornare questa schermata.')}}catch(e){cloudMessage('Controllo cloud non riuscito: '+e.message)}}
function cloudPage(a){a.innerHTML=`<h2>☁️ Sincronizzazione Mac e Linux</h2><div class="card"><h3>Stato</h3><p id="cloudStatus" role="status">${esc(cloudStatus)}</p><p class="muted">I dati restano anche in questo browser. Il primo caricamento è manuale per evitare di perdere informazioni. Prima di ogni passaggio importante esporta un backup JSON.</p><button class="secondary" onclick="backup()">💾 Scarica backup JSON</button></div>${!cloudSession?`<div class="card" style="margin-top:15px"><h3>Accedi al tuo archivio</h3><p class="muted">Inserisci la publishable key del progetto Supabase (non la secret key). Email e password sono quelle dell'utente creato in Authentication → Users. La password non viene salvata.</p><div class="form"><label>Publishable key<input id="cloudKey" type="text" autocomplete="off" value="${esc(cloudKey)}" placeholder="sb_publishable_..."></label><label>Email<input id="cloudEmail" type="email" autocomplete="username"></label><label>Password<input id="cloudPassword" type="password" autocomplete="current-password"></label></div><button onclick="cloudLogin()">Accedi</button></div>`:`<div class="card" style="margin-top:15px"><h3>Archivio cloud</h3><p>Connesso come <b>${esc(cloudSession.user?.email||'utente')}</b> · Versione locale nota: <b>${cloudVersion??'non inizializzata'}</b></p><div class="rowbuttons"><button onclick="cloudInitialize()">1. Inizializza dal Mac</button><button class="secondary" onclick="cloudDownload()">2. Scarica dal cloud</button><button class="secondary" onclick="cloudUpload(true)">Salva modifiche sul cloud</button><button class="secondary" onclick="cloudCheck()">Controlla aggiornamenti</button><button class="danger" onclick="cloudLogout()">Esci</button></div><p class="muted">Prima volta: sul Mac che contiene i dati completi usa “Inizializza dal Mac” una sola volta. Su Linux accedi e premi “Scarica dal cloud”. Le modifiche successive vengono inviate automaticamente quando la connessione è attiva. Se due computer modificano contemporaneamente, la versione blocca la sovrascrittura e chiede un intervento manuale.</p></div>`}`}
